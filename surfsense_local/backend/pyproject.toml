[project]
name = "surfsense-local-backend"
version = "0.0.1"
description = "SurfSense Community Local backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<1.19",
    "fastapi>=0.115.8",
    "huey>=3.3.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "worker*", "modules*", "shared*", "alembic*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM",  # flake8-simplify
    "RUF",
    "D103", # a test without a docstring does not say what it guarantees
]

[tool.ruff.lint.per-file-ignores]
# import_models and import_tasks import for the registration, never for a name.
"shared/db.py" = ["F401"]
"shared/queue.py" = ["F401"]
# D103 is here to make tests state what they guarantee, not to gate app code.
"api/**" = ["D103"]
"worker/**" = ["D103"]
"modules/**" = ["D103"]
"shared/**" = ["D103"]
"alembic/**" = ["D103"]

[tool.ruff.lint.isort]
known-first-party = ["api", "modules", "shared", "tests", "worker"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -ra --strict-markers --import-mode=importlib"
markers = [
    "unit: pure logic tests, no database or external services",
    "integration: tests that run against a real SQLite database built by migrations",
]
