appId: com.surfsense.local
productName: SurfSense Local
directories:
  output: release
  buildResources: build

# The asar carries only the main + preload bundles. The renderer SPA, the two
# frozen Python binaries, and the Ollama server ride alongside in resources/,
# where the main process spawns them by path (sidecars/) and loads the SPA from
# disk (index.ts).
files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: ../backend/dist/api
    to: backend/api
  - from: ../backend/dist/worker
    to: backend/worker
  - from: ../frontend/dist
    to: frontend/dist
  # ~66MB bge-small encoder: shipped so ingest and search work fully offline.
  # The Docling parser (~1.6GB) is not shipped; it downloads on first PDF.
  - from: ../backend/models
    to: models
  # The Ollama server (fetch-ollama.mjs stages it here). Models are pulled by the
  # user post-install into the writable data dir, not shipped.
  - from: ollama
    to: ollama

linux:
  target: [AppImage, deb]
  category: Office

win:
  target: [nsis]


mac:
  target: [dmg]
  category: public.app-category.productivity
