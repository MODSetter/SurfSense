appId: com.surfsense.app
productName: SurfSense
directories:
  output: release
  buildResources: build

# The asar carries only the main + preload bundles. The renderer SPA, the
# frozen Python backend, and llama-server ride alongside in resources/,
# where the main process spawns them by path (sidecars/) and loads the SPA from
# disk (index.ts).
files:
  - out/**/*
  - package.json

asar: true

extraResources:
  # One frozen binary runs as the API or as a worker (bundling/backend.spec), so
  # their shared libraries ship once.
  - from: ../backend/dist/backend
    to: backend
  - from: ../frontend/dist
    to: frontend/dist
  # Embedding, voice, and Docling parser packs (build:model, build:voice,
  # build:parser). First PDF stays offline; the worker is not blocked on Hub.
  - from: ../backend/models
    to: models
  # llama-server in router mode (fetch-llamacpp.mjs verifies a pinned build and
  # SHA-256, then prunes 24 executables to one plus its libraries). The GPU
  # backend is Vulkan everywhere off Apple Silicon; no CUDA payload ships.
  # Weights are downloaded post-install into the writable data dir, never bundled.
  - from: llamacpp
    to: llamacpp
  # stable-diffusion.cpp's sd-server for local image generation (../runtimes/sdcpp/).
  # Empty on hosts with no prebuilt binary; the sidecar then simply does not start.
  - from: sdcpp
    to: sdcpp
  # audio.cpp's server for podcast voices, with the eSpeak-ng it phonemises
  # through (../runtimes/audiocpp/). The default voice rides in the models pack
  # above (build:voice); every other voice model is downloaded.
  - from: audiocpp
    to: audiocpp
  # opencode's server for the agent, and the ripgrep it greps with
  # (../runtimes/opencode/). Pinned by version and SHA-256; it starts only once the
  # API writes its configuration. Staged for every build; one made with
  # SURFSENSE_LOCAL_OPENCODE_ENABLED=0 stages nothing, and electron-builder
  # warns that the folder is missing and skips it.
  - from: opencode
    to: opencode
  # Third-party licence notices for everything above (build:notices,
  # scripts/notices/). The generators' fragments stay behind.
  - from: licenses
    to: licenses
    filter:
      - THIRD_PARTY_NOTICES.*

# Signs the Windows app's native libraries, which electron-builder leaves
# unsigned, once its .exe files are signed and before SurfSense.exe and the
# installer are (scripts/windows-signing/after-pack.mjs).
afterPack: ./scripts/windows-signing/after-pack.mjs

# Runs the packaged opencode once it is signed, before any installer is made and
# so before a tag's build uploads one (scripts/opencode/after-sign.mjs).
afterSign: ./scripts/opencode/after-sign.mjs

# The legacy 0.0.x desktop lives in the same repo and its updater reads
# latest*.yml; this app publishes stable*.yml. Both manifests now sit on the
# same release (see legacy-update-bridge in release-local.yml), so the channel
# is the only thing keeping either app from parsing the other's.
publish:
  provider: github
  owner: MODSetter
  repo: SurfSense
  channel: stable

# Artifact names carry no version, so `/releases/latest/download/<name>` is a
# permalink the README and the site can hardcode. electron-updater is fine with
# it: the manifests name the file, and a cached download is validated by sha512
# before it is ever installed.
#
# ponytail: the arch stays on the Mac names because the /downloads grid and the
# license mail label assets by suffix (`-arm64.dmg`); dropping it there would
# fall through to the raw filename. Windows and Linux ship one arch each, so
# they leave it out — add `${arch}` back on the day a second one appears, or the
# two builds overwrite each other.
linux:
  # The snap is built by its own job from the packaged folder (`snapcraft:` below).
  target: [AppImage, deb, rpm]
  artifactName: "${productName}.${ext}"
  category: Office
  icon: build/icons/packaged/icon.png
  executableName: surfsense-local
  desktop:
    entry:
      Name: SurfSense
      Comment: Local-first research over your own documents
      Categories: Office;Utility;
      StartupWMClass: SurfSense

# llama-server does not start without the host's libgomp.so.1, which llama.cpp's
# archive does not carry, so the deb depends on libgomp1. It goes to fpm as an
# extra --depends because setting `depends` would replace electron-builder's GTK,
# NSS and X libraries. llama.cpp's GPU backend opens libvulkan.so.1 from the host.
# Recommended, not depended on: without it the app still runs, on the CPU.
# Setting `recommends` replaces electron-builder's list, so its default stays first.
# deb and rpm both write resources/package-type into linux-unpacked, which keeps
# the last one's.
deb:
  recommends:
    - libappindicator3-1
    - libvulkan1
  # libc6: the frozen backend's bundled libgcc_s needs glibc 2.35, so apt refuses
  # an older system rather than installing an app that cannot start.
  fpm:
    - --depends=libgomp1
    - --depends=libc6 (>= 2.35)

# electron-builder's default requires without libXScrnSaver, which EL10 ships only
# in EPEL and Electron 44 never loads, plus libgomp (openSUSE: libgomp1) for
# llama.cpp. Setting depends replaces the defaults, so the rest is restated. fpm
# has no recommends option for rpm, so --rpm-tag writes the weak dependency into
# the spec as it is. fpm leaves AutoReqProv off, so no linked library becomes a
# requirement on its own.
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - (libgomp or libgomp1)
  fpm:
    - "--rpm-tag=Recommends: vulkan-loader"

# The static type-2 runtime carries its own FUSE library, so the AppImage starts
# without libfuse2, which Ubuntu 22.04 and later do not install. electron-builder
# 26.16 still calls it beta. It compresses with zstd, and the .desktop entry no
# longer passes --no-sandbox: AppRun adds it when `unshare -Ur true` fails, where
# user namespaces are blocked.
toolsets:
  appimage: "1.0.3"

# Read by the snap job's `electron-builder --linux snap --prepackaged`. The store
# name comes from executableName: surfsense-local. `publish` names GitHub so
# electron-builder never falls back to uploading to the Snap Store; the snap job
# does that. Listing our own plugs drops the browser-support allow-sandbox plug,
# which needs store review, so the launcher passes --no-sandbox and confinement
# sandboxes the app. network-bind serves the local API; audio-record, for speech
# to text, is not connected automatically. libgomp1 is for llama.cpp, as above.
snapcraft:
  base: core24
  publish:
    provider: github
    owner: MODSetter
    repo: SurfSense
    channel: stable
  core24:
    confinement: strict
    grade: stable
    summary: Local-first research over your own documents
    description: >-
      SurfSense is a local-first desktop app for research over your own
      documents. It parses and embeds them on this computer, answers questions
      about them with citations, and runs its language, voice and image models
      locally.
    plugs: [default, browser-support, network-bind, audio-record]
    stagePackages: [default, libgomp1, libvulkan1]

win:
  target: [nsis]
  artifactName: "${productName}-Setup.${ext}"
  icon: build/icons/packaged/icon.ico


mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: build/icons/packaged/icon.icns
  artifactName: "${productName}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The microphone prompt's sentence; askForMediaAccess needs one, and Electron's
  # own says only that the app needs the microphone.
  extendInfo:
    NSMicrophoneUsageDescription: "SurfSense turns your speech into text on this computer."
  # opencode arrives Developer ID signed by its vendor, with the hardened
  # runtime, a timestamp and the five entitlements Bun needs. Re-signing it would
  # swap those for ours, which lack disable-executable-page-protection. rg
  # arrives only ad-hoc signed, so it is signed with the app.
  signIgnore:
    - "/Contents/Resources/opencode/opencode$"
  notarize: true

# LZFSE (ULFO), not zlib (UDZO): smaller (about 37 MB, projected) and 1.7 to 2.5 times
# as fast to decode, so macOS verifies and copies out no slower. LZMA (ULMO) decodes 5 to
# 9 times slower than zlib, a wait every install would see; bzip2 (UDBZ) is slower still.
dmg:
  format: ULFO
