appId: com.surfsense.local
productName: SurfSense Local
directories:
  output: release
  buildResources: build

# The asar carries only the main + preload bundles. The renderer SPA and the two
# frozen Python binaries ride alongside in resources/, where the main process
# spawns them by path (sidecars.ts) and loads the SPA from disk (index.ts).
files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: ../backend/dist/api
    to: backend/api
  - from: ../backend/dist/worker
    to: backend/worker
  - from: ../frontend/dist
    to: frontend/dist
  # ~66MB bge-small encoder: shipped so ingest and search work fully offline.
  # The Docling parser (~1.6GB) is not shipped; it downloads on first PDF.
  - from: ../backend/models
    to: models

linux:
  target: [AppImage]
  category: Office

win:
  target: [nsis]


mac:
  target: [dmg]
  category: public.app-category.productivity
