allowBuilds:
  electron: true
  esbuild: true
  # Only used for the Squirrel.Windows target; electron-builder.yml ships nsis.
  electron-winstaller: false

overrides:
  # @electron/osx-sign pins 4.x, which throws RangeError on protobuf-like files while signing.
  isbinaryfile: ^5.0.7

patchedDependencies:
  electron-updater@6.8.9: patches/electron-updater@6.8.9.patch
