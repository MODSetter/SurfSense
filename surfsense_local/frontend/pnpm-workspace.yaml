packages: []

allowBuilds:
  esbuild: true
  msw: false

minimumReleaseAgeExclude:
  - react-intl@12.1.3
  - '@formatjs/cli-native-darwin-arm64@1.1.26'
  - '@formatjs/cli-native-linux-arm64-musl@1.0.24'
  - '@formatjs/cli-native-linux-arm64@1.2.26'
  - '@formatjs/cli-native-linux-x64-musl@1.0.24'
  - '@formatjs/cli-native-linux-x64@1.1.26'
  - '@formatjs/cli-native-win32-x64@1.1.27'
  - '@formatjs/cli@6.16.32'
  - eslint-plugin-formatjs@8.1.0

overrides:
  # exceljs 4.4.0, its latest release, still asks for uuid ^8.3.0
  # (GHSA-w5hq-g745-h8pq). It only calls v4() via require('uuid'), which
  # uuid 11 still ships as CommonJS; 12 and later are ESM-only. The app
  # bundle uses exceljs's prebuilt browser build, which carries its own copy.
  'uuid@<11.1.1': ^11.1.1
