<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Electron's hidden snapshot window (electron/src/main/docx-snapshot/):
      it lays out one Word file or PowerPoint deck and prints it to PDF for
      the agent's previews. No app styles, so only the document's own look
      reaches the page.

      The document is untrusted. A Word file's pages are images the page draws
      from it; a deck's styles are inline and its pictures object URLs. The
      only fetches are the file from the API on loopback and the Word parser,
      inlined as a data URL, which its worker runs as WebAssembly. connect-src
      has no 'self': packaged, that is file://, and a script that got in could
      read any local file. vite.config.ts adds it in development for Vite's
      client.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src blob: data:; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src http://127.0.0.1:* data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Document snapshot</title>
  </head>
  <body>
    <script type="module" src="/src/features/docx-snapshot/main.ts"></script>
  </body>
</html>
