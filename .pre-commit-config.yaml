# Pre-commit configuration for SurfSense
# See https://pre-commit.com for more information

repos:
  # General file quality hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--multi, --unsafe]
      - id: check-json
        exclude: '(tsconfig\.json|\.vscode/.*\.json)$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=10240]  # 10MB limit
      - id: debug-statements
      - id: check-case-conflict

  # Security - detect secrets across all file types
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.env\.example|
            .*\.env\.template|
            .*/tests/.*|
            .*test.*\.py|
            test_.*\.py|
            .github/workflows/.*\.yml|
            .github/workflows/.*\.yaml|
            .*pnpm-lock\.yaml|
            .*alembic\.ini|
            .*alembic/versions/.*\.py|
            .*\.mdx$|
            .*/messages/.*\.json$
          )$

  # Python Backend Hooks (surfsense_backend) - Using Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        name: ruff-check
        files: ^surfsense_backend/
        exclude: ^surfsense_backend/(test_.*\.py|.*test.*\.py)
        args: [--fix]
      - id: ruff-format
        name: ruff-format
        files: ^surfsense_backend/
        exclude: ^surfsense_backend/(test_.*\.py|.*test.*\.py)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        files: ^surfsense_backend/
        args: ['-f', 'json', '--severity-level', 'high', '--confidence-level', 'high']
        exclude: ^surfsense_backend/(tests/|test_.*\.py|.*test.*\.py|alembic/)

  # Biome hooks for TypeScript/JavaScript projects
  - repo: local
    hooks:
      # Biome check for surfsense_web
      - id: biome-check-web
        name: biome-check-web
        entry: bash -c 'cd surfsense_web && npx @biomejs/biome@2.4.6 check --diagnostic-level=error .'
        language: system
        files: ^surfsense_web/
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Links, tables and proposal status across docs/ and plans/. Every file, every
  # run: a deleted or renamed file breaks links in docs nobody touched.
  - repo: local
    hooks:
      - id: check-docs
        name: check-docs
        entry: python scripts/check_docs.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # The desktop app's translation catalogs. formatjs-extract regenerates
  # en.json from the code, so a stale en.json fails the commit as a modified
  # file. formatjs-verify: every key translated, no extra keys, the same
  # placeholders and tags. check-translations adds the SurfSense rules.
  - repo: local
    hooks:
      - id: formatjs-extract
        name: formatjs-extract
        entry: formatjs extract "surfsense_local/frontend/src/**/*.{ts,tsx}" "surfsense_local/electron/src/main/**/*.ts" --ignore "**/*.test.*" --format simple --out-file surfsense_local/frontend/translations/en.json
        language: node
        additional_dependencies: ["@formatjs/cli@6.16.32"]
        files: ^surfsense_local/(frontend/(src/|translations/en\.json)|electron/src/main/)
        pass_filenames: false
        stages: [pre-commit]
      - id: formatjs-verify
        name: formatjs-verify
        entry: formatjs verify surfsense_local/frontend/translations/*.json --source-locale en --missing-keys --extra-keys --structural-equality
        language: node
        additional_dependencies: ["@formatjs/cli@6.16.32"]
        files: ^surfsense_local/frontend/translations/
        pass_filenames: false
        stages: [pre-commit]
      - id: check-translations
        name: check-translations
        entry: node scripts/check_translations.mjs
        language: system
        files: ^surfsense_local/frontend/(translations/|src/features/)
        pass_filenames: false
        stages: [pre-commit]

  # Commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

# Global configuration
default_stages: [pre-commit]
fail_fast: false

