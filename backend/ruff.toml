# One config for the backend's own code; bundles/ and registry/check/ keep their own.
line-length = 88
target-version = "py312"

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF",
    # Every plugin answers from one process: a blocking call in a coroutine stalls them all.
    "ASYNC",
]

[lint.isort]
known-first-party = ["server", "license", "mailer", "host", "mcp_server", "proprietary"]

[lint.per-file-ignores]
# Command-line tools: printing is their output, and the operator's prompt has the loop to itself.
"license/scripts/*" = ["T201", "ASYNC250"]
