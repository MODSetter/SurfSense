[project]
name = "surfsense-plugin-manifest"
# Never published: the app and the plugin tooling take it by path, so it moves
# with the app's own version.
version = "0.0.0"
description = "The rules a SurfSense plugin's manifest.json must follow, shared by the app and the plugin checks."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surfsense_plugin_manifest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -ra --strict-markers --import-mode=importlib"
markers = ["unit: pure logic tests, no files beyond a temporary folder"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RUF",
    "D103", # a test without a docstring does not say what it guarantees
]

[tool.ruff.lint.per-file-ignores]
# D103 is here to make tests state what they guarantee, not to gate the package.
"surfsense_plugin_manifest/**" = ["D103"]

[tool.ruff.format]
quote-style = "double"
