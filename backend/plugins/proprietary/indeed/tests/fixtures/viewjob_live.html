 will contribute to the design and development of the platform our Customer Success, Trust &amp; Safety, and Operations teams use every day to support clients and job seekers. You'll write code and build integrations that shape how customer issues are routed, prioritized, and resolved across multiple brands and regions. You'll work alongside software engineers, Salesforce developers and administrators, product managers, and business analysts to build reliable, scalable solutions, and you'll grow your technical skills on a platform that is continuously in use. You'll also have opportunities to learn about AI models, tools, and their applications as Indeed responsibly explores how AI can help people get jobs.</p>\n <p>This role offers the chance to work with modern technologies, leveraging AI assisted software development tools, while helping Indeed's support teams shift from reactive case handling to proactive, capacity-aware engagement.</p>\n <p></p>\n <h2><b> Responsibilities</b></h2>\n <p></p>\n <ul>\n  <li>Develop, test, and maintain features for a suite of shared services and tools.</li>\n  <li>Collaborate with engineers and cross-functional partners to deliver well-designed solutions.</li>\n  <li>Participate in code reviews and incorporate feedback to improve code quality and maintainability.</li>\n  <li>Learn and apply new technologies, tools, and best practices in software engineering.</li>\n </ul>\n <p></p>\n <h2><b> Skills/Competencies</b></h2>\n <p></p>\n <ul>\n  <li>Bachelor's degree required in Computer Science, Computer Engineering, Electrical Engineering, Mathematics, or related field</li>\n  <li>Familiarity with AWS, Java, Kotlin, and/or React.js</li>\n  <li>Passion to learn and develop new skills continuously</li>\n </ul>\n <p></p>\n <h2><b> Salary Range Transparency</b></h2>\n <p></p>\n <div>\n  <br>\n   Tier 2 - United States of America 94,000 - 142,000 USD per year\n </div>\n <p></p>\n <h2><b><br>\n    Salary Range Disclaimer</b></h2>\n <p></p>\n qual opportunity employer, seeking to create a welcoming and diverse environment. All qualified applicants will receive consideration for employment without regard to race, color, religion, gender, gender identity or expression, family status, marital status, sexual orientation, national origin, genetics, neuro-diversity, disability, age, or veteran status, or any other non-merit based or legally protected grounds.\n </div>\n <div></div>\n <div>\n  <br>\n   Indeed provides reasonable accommodations to qualified individuals with disabilities in the employment application process. To request an accommodation, please visit https://www.indeed.com/careers/accommodations. If you are requesting accommodation for an interview, please reach out at least one week in advance of your interview.\n </div>\n <div></div>\n <div>\n  <br>\n   For more information about our commitment to equal opportunity/affirmative action, please visit our Careers page (https://www.indeed.com/careers).\n </div>\n <div>\n  <b><br>\n    Inclusion &amp; Belonging</b>\n </div>\n <div>\n  <br>\n   Inclusion and belonging are fundamental to our hiring practices and company culture, forming an integral part of our vision for a better world of work. At Indeed, we’re committed to the wellbeing of our employees and on a mission to make this the best place to work and thrive. We believe that fostering an inclusive environment where every employee feels respected and accepted benefits everyone, fueling innovation and creativity.\n </div>\n <div></div>\n <div>\n  <br>\n   We value diverse experiences, including those who have had prior contact with the criminal legal system. We are committed to providing individuals with criminal records, including formerly incarcerated individuals, a fair chance at employment.\n </div>\n <div></div>\n <div>\n  <br>\n   Those with military experience are encouraged to apply. Equivalent expertise demonstrated through a combination of work experience, training, military experience, or education is welcome.\n </div>\n <p></p>\n <h2><b> Indeed’s Employee Recruiting Privacy Policy</b></h2>\n <p></p>\n <div>\n  Like other employers Indeed uses our own technologies to help us find and attract top talent from around the world. In addition to our site’s user and privacy policy found at https://www.indeed.com/legal, we also want to make you aware of our recruitment specific privacy policy found at https://www.indeed.com/legal/indeed-jobs. \n  <br>\n  <br><b>Agency Disclaimer</b>\n </div>\n <div>\n  <br>\n   Indeed does not pay placement fees for unsolicited resumes or referrals from non-candidates, including search firms, staffing agencies, professional recruiters, fee-based referral services, and recruiting agencies (each individually, an \"Agency\"), subject to local laws. An Agency seeking a placement fee must obtain advance written approval from Indeed's internal Talent Acquisition team and execute a fee agreement with Indeed for each job opening before making a referral or submitting a resume for that opening. \n  <br>\n  <br><b>AI Notice</b>\n  <br>\n  <br>\n   Indeed is committed to ensuring fairness and transparency throughout our hiring process. We use artificial intelligence (AI) tools to assist in the screening, assessment, and selection of applicants for this position by analyzing information provided in resumes and applications. Our use of AI does not replace human decision-making.\n </div>\n <div></div>\n <div>\n  <br>\n   Unless otherwise notified, Indeed does not use AI constituting an AEDT or an ADMT as those tools are defined in applicable laws.\n </div>\n <div></div>\n <div>\n  <b><br>\n    Reference ID:</b> 47665\n </div>\n <ul>\n  <li>All Other Roles: <b>The deadline to apply to this position is 10/04/2026. Job postings may be extended at the hiring team’s discretion based on applicant volume.</b></li>\n </ul>\n <div></div>\n <div>\n  <br>\n   It is unlawful in Massachusetts to require or administer a lie detector test as a cond
