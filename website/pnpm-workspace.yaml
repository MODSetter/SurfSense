packages:
  - "."

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 10080

# Security floors for transitive dependencies whose parents pin a vulnerable
# version. Each stays inside the major its dependents use.
overrides:
  "@opentelemetry/core@>=2.0.0 <2.8.0": "^2.8.0"
  "@opentelemetry/propagator-jaeger@>=2.0.0 <2.9.0": "^2.9.0"
  "dompurify@>=3.0.0 <3.4.13": "^3.4.13"
  "prismjs@>=1.0.0 <1.30.0": "^1.30.0"
