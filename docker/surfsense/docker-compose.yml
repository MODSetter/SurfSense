# SurfSense in one container (docs/architecture/docker.md).
#   cp .env.example .env && docker compose up -d
# then open http://localhost:4929.
name: surfsense

services:
  surfsense:
    image: ${SURFSENSE_IMAGE:-ghcr.io/modsetter/surfsense}:${SURFSENSE_VERSION:-latest}${SURFSENSE_VARIANT:+-${SURFSENSE_VARIANT}}
    ports:
      # Every network the server is on, behind the password (ADR 0074);
      # SURFSENSE_BIND=127.0.0.1 keeps it to this machine.
      - "${SURFSENSE_BIND:-0.0.0.0}:${SURFSENSE_PORT:-4929}:80"
      # HTTPS, once SURFSENSE_TLS or SURFSENSE_DOMAIN asks for it; nothing listens here otherwise.
      - "${SURFSENSE_BIND:-0.0.0.0}:${SURFSENSE_HTTPS_PORT:-4943}:443"
    volumes:
      - surfsense_data:/data
    environment:
      # Sign-ins send the browser back through the published port.
      SURFSENSE_LOCAL_PUBLIC_PORT: ${SURFSENSE_PORT:-4929}
      # Optional: otherwise the install's secret is created once in the volume.
      SURFSENSE_LOCAL_SECRET: ${SURFSENSE_SECRET:-}
      # Optional: sets the sign-in password at start; it can also be created in the app.
      SURFSENSE_PASSWORD: ${SURFSENSE_PASSWORD:-}
      SURFSENSE_ALLOWED_HOSTS: ${SURFSENSE_ALLOWED_HOSTS:-}
      # none: your own proxy or VPN signs people in, and SurfSense never asks.
      SURFSENSE_AUTH: ${SURFSENSE_AUTH:-}
      SURFSENSE_TLS: ${SURFSENSE_TLS:-}
      SURFSENSE_DOMAIN: ${SURFSENSE_DOMAIN:-}
      # Plain HTTP on another address redirects to HTTPS on this, the published port.
      SURFSENSE_HTTPS_PORT: ${SURFSENSE_HTTPS_PORT:-4943}
    # The supervisor gives each sidecar 5 s after SIGTERM; Docker's 10 s is too tight.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  surfsense_data:
