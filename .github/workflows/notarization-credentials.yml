name: Apple Notarization Credentials

# A lapsed Apple Developer agreement or credential stops notarization, which
# otherwise shows only at the end of a release build. This asks Apple in
# seconds: weekly, on demand, and before every release build, dry runs too.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Ask Apple for the notarization history
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The caller's event when called from the release workflow.
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            # A tag must notarize; a fork's dry run has no secrets and builds unsigned.
            if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
              echo "::error::Apple notarization secrets are missing for a release tag."
              exit 1
            fi
            echo "::notice::No Apple notarization secrets here; nothing to check."
            exit 0
          fi
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" > /dev/null
