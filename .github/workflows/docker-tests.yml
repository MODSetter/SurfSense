name: Docker Tests

# surfsense_backend and surfsense_web, which ship as Docker images.
# code-quality.yml holds the checks that belong to the whole repository.

on:
  pull_request:
    branches: [legacy]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One filter per job, so a web-only change does not start Postgres,
  # OpenSandbox and the backend integration tests.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A manual run has no pull request to diff; it starts every job instead.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'surfsense_backend/**'
              - 'docker/opensandbox/**'
              - 'docker/sandbox/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/docker-tests.yml'
            web:
              - 'surfsense_web/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/docker-tests.yml'

  # Ruff and bandit on the changed files only, through pre-commit: the whole
  # tree does not pass ruff yet, so linting all of it would fail every PR.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} 2>/dev/null || git fetch origin ${{ github.base_ref }} 2>/dev/null || true

      # Matches surfsense_backend/.python-version.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-backend-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-backend-

      - name: Run ruff and bandit on changed files
        run: |
          if git show-ref --verify --quiet refs/heads/${{ github.base_ref }}; then
            BASE_REF="${{ github.base_ref }}"
          elif git show-ref --verify --quiet refs/remotes/origin/${{ github.base_ref }}; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            echo "Base branch reference not found, checking all files"
            status=0
            for hook in ruff ruff-format bandit-docker; do
              pre-commit run "$hook" --all-files || status=1
            done
            exit $status
          fi

          echo "Running ruff and bandit on changed files against $BASE_REF"
          status=0
          for hook in ruff ruff-format bandit-docker; do
            pre-commit run "$hook" --from-ref "$BASE_REF" --to-ref HEAD || status=1
          done
          exit $status

  # Biome through the pre-commit hook, which checks all of surfsense_web at
  # error level with the app's own Biome, so its dependencies come first.
  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # surfsense_web pins its own pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: surfsense_web/package.json

      # Matches surfsense_web's engines, which Vercel builds with, its Dockerfile
      # (node:24) and @types/node ^24.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: surfsense_web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: surfsense_web
        run: pnpm install --frozen-lockfile

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run Biome
        run: pre-commit run biome-check-web --all-files

  # tsx --test, with no browser or services. A job of its own rather than a
  # step in web-lint so a failing test is reported apart from a lint failure.
  web-unit:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: surfsense_web/package.json

      # Matches surfsense_web's engines, which Vercel builds with, its Dockerfile
      # (node:24) and @types/node ^24.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: surfsense_web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: surfsense_web
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: surfsense_web
        run: pnpm test:unit

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    # A hung test fails here rather than at GitHub's 6-hour default.
    timeout-minutes: 60
    env:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Matches surfsense_backend/.python-version.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: surfsense_backend/uv.lock
          python-version: '3.12'

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ env.EMBEDDING_MODEL }}

      - name: Install dependencies
        working-directory: surfsense_backend
        run: uv sync

      - name: Run unit tests
        working-directory: surfsense_backend
        run: uv run pytest -m unit

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    timeout-minutes: 60
    env:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      REDIS_APP_URL: redis://localhost:6379/0
      SANDBOX_IMAGE: surfsense/sandbox:dev

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surfsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d surfsense_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Matches surfsense_backend/.python-version.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: surfsense_backend/uv.lock
          python-version: '3.12'

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ env.EMBEDDING_MODEL }}

      - name: Install dependencies
        working-directory: surfsense_backend
        run: uv sync

      - name: Build sandbox image
        run: docker build -t surfsense/sandbox:dev -f docker/sandbox/Dockerfile docker/sandbox

      - name: Start OpenSandbox
        run: |
          docker run -d --name opensandbox-server \
            --add-host host.docker.internal:host-gateway \
            -p 8080:8080 \
            --tmpfs /data \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/docker/opensandbox/sandbox.toml:/etc/opensandbox/config.toml:ro" \
            -e OPENSANDBOX_SERVER_API_KEY=surfsense-dev-sandbox \
            opensandbox/server:v0.2.2
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs opensandbox-server
          exit 1

      - name: Run integration tests
        working-directory: surfsense_backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/surfsense_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          ETL_SERVICE: DOCLING
          OPENSANDBOX_INTEGRATION: '1'
        run: uv run pytest -m integration

  # A job skipped because its files did not change passes; a failed or
  # cancelled one (a timeout included) does not.
  gate:
    name: Docker Gate
    runs-on: ubuntu-latest
    needs: [changes, backend-lint, web-lint, web-unit, backend-unit, backend-integration]
    if: always()

    steps:
      - name: Check every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Docker tests failed"
              exit 1
            fi
          done
          echo "All Docker tests passed"
