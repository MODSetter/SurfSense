name: Docker Tests

# surfsense_backend and surfsense_web, the product that ships as Docker images.
# desktop-tests.yml covers surfsense_local; code-quality.yml the checks that
# belong to the whole repository.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One filter per job, so a web-only change does not start Postgres,
  # OpenSandbox and the backend integration tests.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A manual run has no pull request to diff; it starts every job instead.
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'surfsense_backend/**'
              - 'docker/opensandbox/**'
              - 'docker/sandbox/**'
              - 'docs/contracts/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/docker-tests.yml'
            web:
              - 'surfsense_web/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/docker-tests.yml'
            e2e:
              - 'surfsense_web/**'
              - 'surfsense_backend/**'
              - 'docker/docker-compose.e2e.yml'
              - '.github/workflows/docker-tests.yml'

  # Ruff and bandit on the changed files only, through pre-commit: the whole
  # tree does not pass ruff yet, so linting all of it would fail every PR.
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} 2>/dev/null || git fetch origin ${{ github.base_ref }} 2>/dev/null || true

      # Matches surfsense_backend/.python-version.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-backend-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-backend-

      - name: Run ruff and bandit on changed files
        run: |
          if git show-ref --verify --quiet refs/heads/${{ github.base_ref }}; then
            BASE_REF="${{ github.base_ref }}"
          elif git show-ref --verify --quiet refs/remotes/origin/${{ github.base_ref }}; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            echo "Base branch reference not found, checking all files"
            status=0
            for hook in ruff ruff-format bandit-docker; do
              pre-commit run "$hook" --all-files || status=1
            done
            exit $status
          fi

          echo "Running ruff and bandit on changed files against $BASE_REF"
          status=0
          for hook in ruff ruff-format bandit-docker; do
            pre-commit run "$hook" --from-ref "$BASE_REF" --to-ref HEAD || status=1
          done
          exit $status

  # Biome through the pre-commit hook, which checks all of surfsense_web at
  # error level with the app's own Biome, so its dependencies come first.
  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # surfsense_web pins its own pnpm; the desktop trees pin theirs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: surfsense_web/package.json

      # Matches surfsense_web's Dockerfile (node:20) and @types/node ^20.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: surfsense_web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: surfsense_web
        run: pnpm install --frozen-lockfile

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run Biome
        run: pre-commit run biome-check-web --all-files

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    env:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Matches surfsense_backend/.python-version.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: surfsense_backend/uv.lock
          python-version: '3.12'

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ env.EMBEDDING_MODEL }}

      - name: Install dependencies
        working-directory: surfsense_backend
        run: uv sync

      - name: Run unit tests
        working-directory: surfsense_backend
        run: uv run pytest -m unit

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    env:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      REDIS_APP_URL: redis://localhost:6379/0
      SANDBOX_IMAGE: surfsense/sandbox:dev

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surfsense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d surfsense_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Matches surfsense_backend/.python-version.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: surfsense_backend/uv.lock
          python-version: '3.12'

      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ env.EMBEDDING_MODEL }}

      - name: Install dependencies
        working-directory: surfsense_backend
        run: uv sync

      - name: Build sandbox image
        run: docker build -t surfsense/sandbox:dev -f docker/sandbox/Dockerfile docker/sandbox

      - name: Start OpenSandbox
        run: |
          docker run -d --name opensandbox-server \
            --add-host host.docker.internal:host-gateway \
            -p 8080:8080 \
            --tmpfs /data \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE/docker/opensandbox/sandbox.toml:/etc/opensandbox/config.toml:ro" \
            -e OPENSANDBOX_SERVER_API_KEY=surfsense-dev-sandbox \
            opensandbox/server:v0.2.2
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs opensandbox-server
          exit 1

      - name: Run integration tests
        working-directory: surfsense_backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/surfsense_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          ETL_SERVICE: DOCLING
          OPENSANDBOX_INTEGRATION: '1'
        run: uv run pytest -m integration

  e2e:
    name: E2E Journey
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
    timeout-minutes: 30

    env:
      # Test user that the backend creates via /auth/register before Playwright runs.
      PLAYWRIGHT_TEST_EMAIL: e2e-test@surfsense.net
      PLAYWRIGHT_TEST_PASSWORD: E2eTestPassword123!
      # Frontend env: Playwright's webServer (surfsense_web/playwright.config.ts)
      # spawns `pnpm build && pnpm start` in CI.
      NEXT_PUBLIC_FASTAPI_BACKEND_URL: http://localhost:8000
      SURFSENSE_BACKEND_INTERNAL_URL: http://localhost:8000
      AUTH_TYPE: LOCAL
      # Shared secret for the test-only POST /__e2e__/auth/token endpoint.
      # Must match docker-compose.e2e.yml's backend env (x-backend-env).
      E2E_MINT_SECRET: e2e-mint-secret-not-for-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds the e2e image, brings up db + redis + backend + celery_worker, and
      # waits until every healthcheck is green.
      - name: Build & start backend stack
        run: |
          docker compose -f docker/docker-compose.e2e.yml \
            up -d --build --wait --wait-timeout 300

      - name: Show backend stack status
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml ps

      - name: Register E2E test user
        run: |
          # 200/201 = created, 400 = already exists (idempotent across reruns).
          STATUS=$(curl -s -o /tmp/register.json -w "%{http_code}" \
            -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${PLAYWRIGHT_TEST_EMAIL}\",\"password\":\"${PLAYWRIGHT_TEST_PASSWORD}\"}")
          echo "Register status: ${STATUS}"
          cat /tmp/register.json
          if [ "${STATUS}" != "200" ] && [ "${STATUS}" != "201" ] && [ "${STATUS}" != "400" ]; then
            echo "::error::Failed to register test user (status ${STATUS})"
            exit 1
          fi

          # Flush auth rate-limit counters so Playwright starts clean.
          docker compose -f docker/docker-compose.e2e.yml exec -T redis \
            sh -c "redis-cli --scan --pattern 'surfsense:auth_rate_limit:*' \
              | xargs -r redis-cli DEL" || true

      # surfsense_web pins its own pnpm; the desktop trees pin theirs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: surfsense_web/package.json

      # Matches surfsense_web's Dockerfile (node:20) and @types/node ^20.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: surfsense_web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: surfsense_web
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('surfsense_web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: surfsense_web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: surfsense_web
        run: pnpm exec playwright install-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: surfsense_web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('surfsense_web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('surfsense_web/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Run Playwright tests
        working-directory: surfsense_web
        run: pnpm test:e2e:prod

      - name: Dump backend stack logs on failure
        if: ${{ failure() || cancelled() }}
        run: |
          mkdir -p ./compose-logs
          docker compose -f docker/docker-compose.e2e.yml logs --no-color --timestamps \
            > ./compose-logs/all-services.log 2>&1 || true
          for svc in db redis backend celery_worker; do
            docker compose -f docker/docker-compose.e2e.yml logs --no-color --timestamps "$svc" \
              > "./compose-logs/${svc}.log" 2>&1 || true
          done
          docker compose -f docker/docker-compose.e2e.yml ps \
            > ./compose-logs/ps.txt 2>&1 || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: surfsense_web/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: surfsense_web/test-results/
          retention-days: 14

      - name: Upload backend stack logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-stack-logs
          path: ./compose-logs/
          retention-days: 7

      - name: Tear down backend stack
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v --remove-orphans

  # A job skipped because its files did not change passes; a failed or
  # cancelled one (a timeout included) does not.
  gate:
    name: Docker Gate
    runs-on: ubuntu-latest
    needs: [changes, backend-lint, web-lint, backend-unit, backend-integration, e2e]
    if: always()

    steps:
      - name: Check every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Docker tests failed"
              exit 1
            fi
          done
          echo "All Docker tests passed"
