name: Plugins Registry Submission

# A plugin submission issue (.github/ISSUE_TEMPLATE/plugin-submit.yml) becomes a
# registry pull request without the publisher touching git.
# - Opened or edited: check it with the registry's own rules and its server, and
#   keep one comment on the issue with the entry it makes or what to fix. Read
#   access to the code only: anyone can open an issue.
# - Labelled `registry: accept` by a maintainer, the only people who can label:
#   write the entry and icon on a branch from dev and open the pull request.
#   plugins-registry.yml checks it as any other, and signs it once merged.
# The issue body is a stranger's text: it reaches the check as a file, never the shell.

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read

env:
  ACCEPT_LABEL: 'registry: accept'
  SUBMISSION_LABEL: plugin-submission

jobs:
  check-submission:
    name: Check the submission
    runs-on: ubuntu-latest
    # The title too: an issue opened from the API by someone without write access
    # loses its labels, as an agent's `gh issue create` does.
    if: >-
      github.event.action != 'labeled' &&
      github.event.issue.state == 'open' &&
      (startsWith(github.event.issue.title, '[plugin submission]') ||
      contains(github.event.issue.labels.*.name, 'plugin-submission'))
    permissions:
      contents: read
      issues: write
    # A newer edit replaces a check still running on the old text.
    concurrency:
      group: registry-submission-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Ids are checked against the list submissions are merged into.
          ref: dev
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        working-directory: plugins/registry/check
        run: uv sync

      - name: Check the submission
        working-directory: plugins/registry/check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          uv run python -m registry_check submission \
            --issue "$RUNNER_TEMP/issue.md" --comment "$RUNNER_TEMP/comment.md" || true

      - name: Label and comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create "$SUBMISSION_LABEL" --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "A plugin submitted for the registry" --force
          gh label create "$ACCEPT_LABEL" --repo "$GITHUB_REPOSITORY" --color 1D76DB \
            --description "A maintainer accepts this plugin submission" --force
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "$SUBMISSION_LABEL"
          if [ ! -s "$RUNNER_TEMP/comment.md" ]; then
            echo "::error::The check wrote no comment; see its step above."
            exit 1
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none

  open-pull-request:
    name: Open the listing pull request
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'registry: accept' &&
      github.event.issue.state == 'open'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: registry-submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      # A pull request opened with GITHUB_TOKEN starts no workflow, so without this
      # secret a maintainer runs plugins-registry.yml on the branch by hand.
      GH_TOKEN: ${{ secrets.REGISTRY_BOT_TOKEN || github.token }}
      ISSUE: ${{ github.event.issue.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ secrets.REGISTRY_BOT_TOKEN || github.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        working-directory: plugins/registry/check
        run: uv sync

      # Checked again: the issue may have changed since the maintainer read it.
      - name: Write the entry and its icon
        working-directory: plugins/registry/check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          uv run python -m registry_check submission --apply \
            --issue "$RUNNER_TEMP/issue.md" --comment "$RUNNER_TEMP/comment.md" \
            --summary "$RUNNER_TEMP/summary.json"

      - name: Say why nothing was opened
        if: failure()
        run: |
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$ACCEPT_LABEL"

      - name: Commit and open the pull request
        run: |
          name=$(jq -r .name "$RUNNER_TEMP/summary.json")
          id=$(jq -r .id "$RUNNER_TEMP/summary.json")
          branch="registry/plugin-submission-$ISSUE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add plugins/registry/plugins.json plugins/registry/icons
          git commit -m "feat(registry): list $name" -m "Fixes #$ISSUE"
          # Accepting again after an edit replaces the branch; its pull request follows.
          git push --force origin "HEAD:refs/heads/$branch"
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            {
              printf '## What\n\nLists %s (`%s`) in the plugin registry.\n\n' "$name" "$id"
              printf '## Why\n\nIts publisher submitted it in #%s, and its checks passed there.\n\n' "$ISSUE"
              printf 'Fixes #%s\n\n' "$ISSUE"
              printf '## How to test\n\nConnect it on a dev build from Settings → Plugins, '
              printf 'signing in as #%s says, and try the prompt it gives.\n' "$ISSUE"
            } > "$RUNNER_TEMP/body.md"
            gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" \
              --title "feat(registry): list $name" --body-file "$RUNNER_TEMP/body.md"
          fi
