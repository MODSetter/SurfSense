name: Code Quality Checks

# Checks that belong to no product, on every PR: file hygiene, docs and
# secrets. A PR touching only docs/, .github/ or scripts/ starts neither
# product workflow, so these must not live in one. Each product lints, scans
# and tests itself: docker-tests.yml and desktop-tests.yml.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-quality:
    name: File Quality
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} 2>/dev/null || git fetch origin ${{ github.base_ref }} 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-

      # Named, not skipped around, so a hook added for one product never runs
      # here. Each product lints and scans its own code in its own workflow.
      - name: Run file quality checks on changed files
        env:
          HOOKS: check-yaml check-json check-toml check-merge-conflict check-added-large-files debug-statements check-case-conflict check-docs
        run: |
          if git show-ref --verify --quiet refs/heads/${{ github.base_ref }}; then
            RANGE="--from-ref ${{ github.base_ref }} --to-ref HEAD"
          elif git show-ref --verify --quiet refs/remotes/origin/${{ github.base_ref }}; then
            RANGE="--from-ref origin/${{ github.base_ref }} --to-ref HEAD"
          else
            echo "Base branch reference not found, checking all files"
            RANGE="--all-files"
          fi
          status=0
          for hook in $HOOKS; do
            pre-commit run "$hook" $RANGE || status=1
          done
          exit $status

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} 2>/dev/null || git fetch origin ${{ github.base_ref }} 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-security-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-security-

      # Secrets are a leak wherever they land, so this scans every PR. bandit
      # is per product: docker-tests.yml and desktop-tests.yml run their own.
      - name: Scan changed files for secrets
        run: |
          if git show-ref --verify --quiet refs/heads/${{ github.base_ref }}; then
            RANGE="--from-ref ${{ github.base_ref }} --to-ref HEAD"
          elif git show-ref --verify --quiet refs/remotes/origin/${{ github.base_ref }}; then
            RANGE="--from-ref origin/${{ github.base_ref }} --to-ref HEAD"
          else
            echo "Base branch reference not found, scanning all files"
            RANGE="--all-files"
          fi
          pre-commit run detect-secrets $RANGE

  # A failed or cancelled check (a timeout included) fails the gate.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [file-quality, security-scan]
    if: always()

    steps:
      - name: Check all jobs status
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Code quality checks failed"
              exit 1
            fi
          done
          echo "✅ All code quality checks passed"
