name: Plugins Pull Request Checks

# backend/: the one backend, its plugin host and every plugin it runs. backend/plugins/bundles/:
# the bundle SDK, its tooling and the example, deferred with
# docs/proposals/plugins/bundles/, whose manifest rules, SDK and CLI it checks.

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Filtered per job, not per workflow: a workflow skipped by its paths leaves
  # its checks pending, while a skipped job reports success.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      manifest_rules_changed: ${{ steps.changed_paths.outputs.manifest_rules_changed }}
      sdk_changed: ${{ steps.changed_paths.outputs.sdk_changed }}
      sdk_or_app_changed: ${{ steps.changed_paths.outputs.sdk_or_app_changed }}
      cli_changed: ${{ steps.changed_paths.outputs.cli_changed }}
      plugin_host_changed: ${{ steps.changed_paths.outputs.plugin_host_changed }}
      images_changed: ${{ steps.changed_paths.outputs.images_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A manual run has no pull request to diff; it starts every job instead.
      - name: Filter changed paths
        id: changed_paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            manifest_rules_changed:
              - 'backend/plugins/bundles/core/manifest/**'
              - '.github/workflows/plugins-pull-request-checks.yml'
            sdk_changed:
              - 'backend/plugins/bundles/core/sdk/**'
              - '.github/workflows/plugins-pull-request-checks.yml'
            # Either side can break the other: a route the SDK calls, or the SDK.
            sdk_or_app_changed:
              - 'backend/plugins/bundles/core/sdk/**'
              - 'surfsense_local/backend/**'
              - '.github/workflows/plugins-pull-request-checks.yml'
            # invoke runs the SDK and the example against the real app.
            cli_changed:
              - 'backend/plugins/bundles/core/**'
              - 'backend/plugins/bundles/example/**'
              - 'surfsense_local/backend/**'
              - '.github/workflows/plugins-pull-request-checks.yml'
            plugin_host_changed:
              - 'backend/server/**'
              - 'backend/plugins/host/**'
              - 'backend/plugins/mcp_server/**'
              - 'backend/plugins/proprietary/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'backend/ruff.toml'
              - '.github/workflows/plugins-pull-request-checks.yml'
            # What either image copies in: a wrong path fails here, not at Coolify's build.
            images_changed:
              - 'backend/server/**'
              - 'backend/plugins/host/**'
              - 'backend/plugins/mcp_server/**'
              - 'backend/plugins/proprietary/**'
              - 'backend/plugins/registry/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.github/workflows/plugins-pull-request-checks.yml'

  check-manifest-rules:
    name: Check manifest rules
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.manifest_rules_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Python the app ships to plugins, per backend/plugins/bundles/core/build-targets.json.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend/plugins/bundles/core/manifest
        run: uv sync

      - name: Lint
        working-directory: backend/plugins/bundles/core/manifest
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend/plugins/bundles/core/manifest
        run: uv run ruff format --check .

      - name: Run unit tests
        working-directory: backend/plugins/bundles/core/manifest
        run: uv run pytest -m unit

  check-sdk:
    name: Check SDK
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.sdk_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The Python the app ships to plugins, per backend/plugins/bundles/core/build-targets.json.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend/plugins/bundles/core/sdk
        run: uv sync

      - name: Lint
        working-directory: backend/plugins/bundles/core/sdk
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend/plugins/bundles/core/sdk
        run: uv run ruff format --check .

      # Strict, because every plugin is type-checked against what the SDK declares.
      - name: Check types
        working-directory: backend/plugins/bundles/core/sdk
        run: uv run pyright

      - name: Run unit tests
        working-directory: backend/plugins/bundles/core/sdk
        run: uv run pytest -m unit

  check-sdk-against-the-app:
    name: Check SDK against the app
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.sdk_or_app_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      # The contract tests start the real backend, so it needs its own packages.
      - name: Install the app's dependencies
        working-directory: surfsense_local/backend
        run: uv sync

      - name: Install the SDK's dependencies
        working-directory: backend/plugins/bundles/core/sdk
        run: uv sync

      - name: Run contract tests
        working-directory: backend/plugins/bundles/core/sdk
        run: uv run pytest -m contract

  check-cli:
    name: Check CLI
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.cli_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      # invoke's tests run plugins against the real backend.
      - name: Install the app's dependencies
        working-directory: surfsense_local/backend
        run: uv sync

      - name: Install dependencies
        working-directory: backend/plugins/bundles/core/cli
        run: uv sync

      - name: Lint
        working-directory: backend/plugins/bundles/core/cli
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend/plugins/bundles/core/cli
        run: uv run ruff format --check .

      - name: Run tests
        working-directory: backend/plugins/bundles/core/cli
        run: uv run pytest

  check-plugin-host:
    name: Check plugin host
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.plugin_host_changed == 'true'
    # A Stop sent to one copy of the host reaches the copy running the call through Redis.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      # The backend's own code; bundles/ and registry/check/ are checked by their own jobs.
      - name: Lint
        working-directory: backend
        run: uv run ruff check server plugins/host plugins/mcp_server plugins/proprietary

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check server plugins/host plugins/mcp_server plugins/proprietary

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  build-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.images_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built as Coolify builds them, and never pushed.
      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/server/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build the registry image
        uses: docker/build-push-action@v7
        with:
          context: backend/plugins/registry
          push: false
