name: Build and Push Docker Images

# A pull request or push to legacy builds every image and variant to check it,
# and pushes nothing. Only a `legacy-vX.Y.Z` tag publishes; `v*` tags belong to
# the desktop app.
on:
  push:
    branches: [legacy]
    tags:
      - 'legacy-v*'
  pull_request:
    branches: [legacy]
    types: [opened, synchronize, reopened, ready_for_review]

# A release is never cancelled; a newer commit cancels its branch's checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/') && github.event.pull_request.draft != true"
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            images:
              - 'surfsense_backend/**'
              - 'surfsense_web/**'
              - 'docker/sandbox/**'
              - '.github/workflows/docker-build.yml'

  # Refuses a tag that does not match VERSION, so a release is always the
  # version the tagged commit says it is.
  image_version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/legacy-v')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image version
        id: resolve
        run: |
          VERSION="${GITHUB_REF#refs/tags/legacy-v}"
          FILE_VERSION=$(tr -d '[:space:]' < ./VERSION)

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag version '$VERSION' is not X.Y.Z."
            exit 1
          fi
          if [[ "$VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::Tag legacy-v$VERSION does not match VERSION ($FILE_VERSION)."
            exit 1
          fi

          echo "Docker image version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # The same matrix checks a pull request and builds a release, so a tag only
  # repeats builds that already passed.
  build:
    needs: [changes, image_version]
    if: >-
      !cancelled() &&
      (needs.image_version.result == 'success' ||
      (needs.image_version.result == 'skipped' && needs.changes.outputs.images == 'true'))
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        image: [backend, web, sandbox]
        variant: [cpu, cuda, cuda126]
        exclude:
          - image: web
            variant: cuda
          - image: web
            variant: cuda126
          - image: sandbox
            variant: cuda
          - image: sandbox
            variant: cuda126
        include:
          - platform: linux/amd64
            suffix: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            os: ubuntu-24.04-arm
          - image: backend
            name: surfsense-backend
            context: ./surfsense_backend
            file: ./surfsense_backend/Dockerfile
            target: production
          - image: web
            name: surfsense-web
            context: ./surfsense_web
            file: ./surfsense_web/Dockerfile
            target: runner
          - image: sandbox
            name: surfsense-sandbox
            context: ./docker/sandbox
            file: ./docker/sandbox/Dockerfile
          - variant: cpu
            tag_suffix: ""
            use_cuda: "false"
            cuda_extra: cpu
          - variant: cuda
            tag_suffix: "-cuda"
            use_cuda: "true"
            cuda_extra: cu128
          - variant: cuda126
            tag_suffix: "-cuda126"
            use_cuda: "true"
            cuda_extra: cu126
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/legacy-v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase image name
        id: image
        run: echo "name=${REGISTRY_IMAGE,,}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Login to GitHub Container Registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af

      # A check builds and discards; only a release pushes and writes the cache.
      - name: Build ${{ matrix.name }} (${{ matrix.variant }}, ${{ matrix.suffix }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.image.outputs.name }}
          outputs: ${{ env.RELEASE == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.variant }}-${{ matrix.suffix }}
          cache-to: ${{ env.RELEASE == 'true' && format('type=registry,ref={0}:buildcache-{1}-{2},mode=max,image-manifest=true,oci-mediatypes=true', steps.image.outputs.name, matrix.variant, matrix.suffix) || '' }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          provenance: false
          build-args: |
            ${{ matrix.image == 'backend' && format('USE_CUDA={0}', matrix.use_cuda) || '' }}
            ${{ matrix.image == 'backend' && format('CUDA_EXTRA={0}', matrix.cuda_extra) || '' }}

      - name: Export digest
        if: env.RELEASE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Release gate: require both arches for every variant, else block publishing.
  verify_digests:
    runs-on: ubuntu-latest
    needs: [image_version, build]
    if: ${{ always() && needs.image_version.result == 'success' }}
    steps:
      - name: Download all digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: false

      - name: Require both arches for every required variant
        run: |
          fail=0
          check() {
            c=$(find /tmp/digests -type f -path "*/digests-$1-*/*" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$c" -lt 2 ]; then
              echo "::error::$1 has $c/2 arch digests — blocking release"
              fail=1
            else
              echo "OK: $1 ($c/2)"
            fi
          }
          check backend-cpu
          check backend-cuda
          check backend-cuda126
          check web-cpu
          check sandbox-cpu
          [ "$fail" -eq 0 ] || exit 1

  create_manifest:
    runs-on: ubuntu-latest
    needs: [image_version, build, verify_digests]
    if: ${{ !cancelled() && needs.verify_digests.result == 'success' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: surfsense-backend
            image: backend
            variant: cpu
            tag_suffix: ""
          - name: surfsense-backend
            image: backend
            variant: cuda
            tag_suffix: "-cuda"
          - name: surfsense-backend
            image: backend
            variant: cuda126
            tag_suffix: "-cuda126"
          - name: surfsense-web
            image: web
            variant: cpu
            tag_suffix: ""
          - name: surfsense-sandbox
            image: sandbox
            variant: cpu
            tag_suffix: ""
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}

    steps:
      - name: Set lowercase image name
        id: image
        run: echo "name=${REGISTRY_IMAGE,,}" >> $GITHUB_OUTPUT

      - name: Download digests
        id: download
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
        continue-on-error: true

      - name: Check digests
        id: check
        run: |
          count=$(find /tmp/digests -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "digest_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -lt 2 ]; then
            echo "::warning::${{ matrix.variant }}: $count/2 digests, skipping merge"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.image_version.outputs.version }}
            type=sha,prefix=git-
          flavor: |
            latest=true
            ${{ matrix.tag_suffix != '' && format('suffix={0},onlatest=true', matrix.tag_suffix) || '' }}

      - name: Create manifest list and push
        if: steps.check.outputs.skip != 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)
      - name: Inspect image
        if: steps.check.outputs.skip != 'true'
        run: |
          docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}

      - name: Summary
        if: steps.check.outputs.skip != 'true'
        run: | 
          echo "Multi-arch manifest created for ${{ matrix.name }}!"
          echo "Tags: $(jq -cr '.tags | join(", ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
